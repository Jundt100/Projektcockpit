<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjektCockpit – Team-Auslastung</title>
<style>
/* =========================================================
   1. Design Tokens – dunkles Glas-Design mit Salbei-Akzent
   ========================================================= */
:root{
  color-scheme:dark;
  --bg:#141718;
  --glass:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  --tile:rgba(255,255,255,.045);
  --tile-2:rgba(255,255,255,.075);
  --tile-3:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.15);

  --text:#ECEFEC;
  --text-2:#C6CCC7;
  --muted:#939B95;
  --muted-2:#68716B;

  --sage:#A8D19A;  --sage-2:#86B977;  --sage-soft:rgba(168,209,154,.14);  --sage-glow:rgba(168,209,154,.45);
  --amber:#EBBE78; --amber-2:#D99A45; --amber-soft:rgba(235,190,120,.15); --amber-glow:rgba(235,190,120,.45);
  --red:#E8897B;   --red-soft:rgba(232,137,123,.16);  --red-glow:rgba(232,137,123,.45);

  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px; --r-pill:999px;
  --shadow:0 24px 60px rgba(0,0,0,.38);
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}

/* Auslastungsstufen: frei · wenig · gut · voll · überlastet */
.l-none{--c:var(--muted-2);--cs:rgba(255,255,255,.045);--g:transparent}
.l-low {--c:#93B98A;--cs:rgba(147,185,138,.11);--g:rgba(147,185,138,.3)}
.l-good{--c:var(--sage);--cs:var(--sage-soft);--g:var(--sage-glow)}
.l-full{--c:var(--amber);--cs:var(--amber-soft);--g:var(--amber-glow)}
.l-over{--c:var(--red);--cs:var(--red-soft);--g:var(--red-glow)}

/* =========================================================
   2. Basis
   ========================================================= */
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior-x:none}
body{
  font-family:var(--font);color:var(--text);font-size:14px;line-height:1.45;min-height:100vh;
  background:
    radial-gradient(1100px 620px at 12% -12%,rgba(168,209,154,.08),transparent 60%),
    radial-gradient(900px 700px at 105% 105%,rgba(235,190,120,.06),transparent 60%),
    linear-gradient(180deg,#1a1d1e 0%,#121415 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
::selection{background:rgba(168,209,154,.3)}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
*::-webkit-scrollbar-track{background:transparent}

/* Glas-Karten */
.glass{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r-xl);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),var(--shadow);
}
.tile{background:var(--tile);border:1px solid rgba(255,255,255,.06);border-radius:var(--r-lg)}
.card{padding:22px;position:relative;min-width:0}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.card-h h3{font-size:16px;font-weight:500;letter-spacing:.005em}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.card-h small{color:var(--muted);font-size:12.5px}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--tile-2);border:1px solid var(--line);flex:none;color:var(--text-2)}
.ic svg{width:18px;height:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.divider{height:1px;background:var(--line);margin:20px 0}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-pill);
  padding:10px 18px;border:1px solid var(--line);background:var(--tile-2);cursor:pointer;font-weight:500;
  transition:background .2s,border-color .2s,transform .15s var(--out),box-shadow .2s;white-space:nowrap;position:relative;overflow:hidden;
}
.btn:hover{background:var(--tile-3);border-color:var(--line-2)}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn-primary{background:linear-gradient(180deg,#B9DEAB,#8DBF7E);color:#132013;border-color:transparent;font-weight:600;box-shadow:0 10px 28px rgba(168,209,154,.22)}
.btn-primary:hover{background:linear-gradient(180deg,#C4E5B7,#97C788);box-shadow:0 12px 32px rgba(168,209,154,.32)}
.btn-danger{color:var(--red);border-color:rgba(232,137,123,.3);background:var(--red-soft)}
.btn-sm{padding:7px 13px;font-size:13px}
.btn.block{width:100%}
.round{
  width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;flex:none;cursor:pointer;
  background:var(--tile-2);border:1px solid var(--line);color:var(--text-2);position:relative;
  transition:background .2s,border-color .2s,transform .2s var(--spring);
}
.round:hover{background:var(--tile-3);border-color:var(--line-2);color:var(--text)}
.round:active{transform:scale(.92)}
.round svg{width:18px;height:18px}
.round.sm{width:32px;height:32px}
.round.sm svg{width:15px;height:15px}
.round.danger:hover{color:var(--red);border-color:rgba(232,137,123,.4)}
.badge{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px #1a1d1e}

.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r-pill);font-size:12px;font-weight:500;white-space:nowrap;background:var(--tile-2);border:1px solid var(--line);color:var(--text-2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.pill.lv{background:var(--cs);color:var(--c);border-color:transparent}
.pill-glass{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:var(--r-pill);background:var(--tile);border:1px solid var(--line);color:var(--text-2);font-size:13px}
.pill-glass i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tile-2);border:1.5px solid rgba(168,209,154,.45);color:var(--sage)}
.pill-glass i svg{width:15px;height:15px}
.pill-glass b{color:var(--text);font-weight:500}

/* Schalter */
.tgl{position:relative;display:inline-block;width:46px;height:26px;cursor:pointer;flex:none}
.tgl input{position:absolute;opacity:0;width:0;height:0}
.tgl i{position:absolute;inset:0;border-radius:var(--r-pill);background:rgba(255,255,255,.12);transition:background .25s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#e9ece9;transition:left .35s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tgl input:checked + i{background:var(--sage-2)}
.tgl input:checked + i::after{left:23px}

/* Formulare */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field small{font-size:11.5px;color:var(--muted-2)}
.input,.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);
  background:rgba(255,255,255,.045);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;min-width:0;
}
.field textarea{resize:vertical;min-height:70px}
.field select option{background:#1d2122}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(168,209,154,.6);box-shadow:0 0 0 4px rgba(168,209,154,.12);background:rgba(255,255,255,.06)}
.invalid{border-color:var(--red)!important;box-shadow:0 0 0 4px rgba(232,137,123,.12)!important}
.affix{position:relative}
.affix input{padding-right:62px}
.affix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form{display:flex;flex-direction:column;gap:16px}
.form-sec{padding:16px;border-radius:var(--r-lg);background:var(--tile);border:1px solid rgba(255,255,255,.05)}
.form-sec h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
.errors{padding:10px 14px;border-radius:var(--r-md);background:var(--red-soft);color:var(--red);font-size:13px}
.errors ul{margin:4px 0 0;padding-left:18px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}

/* Segment-Umschalter */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:var(--r-pill);background:var(--tile);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:var(--r-pill);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .25s var(--out)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--tile-3);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

/* =========================================================
   3. Shell: Kopfzeile, Navigationsleiste, Inhalt
   ========================================================= */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:18px 28px 10px 24px;position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(20,23,24,.92),rgba(20,23,24,.6) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:500;letter-spacing:.01em;min-width:190px;cursor:pointer}
.logo svg{width:30px;height:30px;color:var(--sage)}
.search{position:relative;flex:0 1 300px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{width:100%;padding:11px 16px 11px 40px;border-radius:var(--r-pill);background:var(--tile);border:1px solid var(--line);outline:none;transition:border-color .2s,background .2s}
.search input:focus{border-color:rgba(168,209,154,.5);background:var(--tile-2)}
.search-res{position:absolute;top:calc(100% + 8px);left:0;right:0;padding:6px;border-radius:var(--r-lg);background:rgba(30,34,35,.97);border:1px solid var(--line-2);box-shadow:var(--shadow);z-index:50;max-height:360px;overflow:auto;animation:pop .18s var(--out)}
.search-res button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:12px;cursor:pointer;text-align:left}
.search-res button:hover,.search-res button.act{background:var(--tile-2)}
.search-res small{color:var(--muted);display:block;font-size:12px}
.search-res .empty{padding:12px;color:var(--muted);font-size:13px}
.status-pill{
  display:inline-flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:var(--r-pill);cursor:pointer;
  background:linear-gradient(180deg,rgba(168,209,154,.14),rgba(168,209,154,.05));border:1px solid rgba(168,209,154,.3);color:var(--text-2);font-size:13.5px;
  transition:border-color .2s,background .2s;margin-left:auto;margin-right:auto
}
.status-pill:hover{border-color:rgba(168,209,154,.55)}
.status-pill .sp-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--sage);color:var(--sage)}
.status-pill .sp-ic svg{width:16px;height:16px}
.status-pill b{color:var(--text);font-weight:500}
.top-actions{display:flex;align-items:center;gap:10px}
.avatars{display:flex;align-items:center;padding:4px 10px 4px 4px;border-radius:var(--r-pill);background:var(--tile);border:1px solid var(--line);cursor:pointer}
.avatars .av{margin-left:-8px;box-shadow:0 0 0 2px #1b1e1f}
.avatars .av:first-child{margin-left:0}
.avatars .more{margin-left:8px;color:var(--muted);font-size:12px}

.rail{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0;position:sticky;top:84px;align-self:start;z-index:25}
.rail button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--tile);border:1px solid var(--line);color:var(--muted);position:relative;transition:all .3s var(--out)}
.rail button svg{width:19px;height:19px}
.rail button:hover{color:var(--text);background:var(--tile-2)}
.rail button.on{background:#ECEFEC;color:#151817;border-color:transparent;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rail button .tip{position:absolute;z-index:60;left:calc(100% + 12px);top:50%;transform:translateY(-50%) translateX(-6px);opacity:0;pointer-events:none;background:#2a2f30;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid var(--line-2);padding:5px 10px;border-radius:10px;font-size:12px;color:var(--text);white-space:nowrap;transition:all .2s var(--out)}
.rail button:hover .tip{opacity:1;transform:translateY(-50%)}
.rail .sep{width:22px;height:1px;background:var(--line);margin:4px 0}

main#view{padding:8px 28px 48px 8px;min-width:0;overflow-x:clip}

/* Begrüssung */
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 24px}
.greet p{font-size:20px;font-weight:300;color:var(--muted)}
.greet h1{font-size:40px;font-weight:300;letter-spacing:-.01em;line-height:1.15}
.greet .pills{display:flex;gap:10px;flex-wrap:wrap}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.page-h h1{font-size:34px;font-weight:300;letter-spacing:-.01em;margin-top:4px}
.page-h p.sub{color:var(--muted);margin-top:6px;max-width:640px}
.page-h .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* =========================================================
   4. Übersicht (Dashboard)
   ========================================================= */
.home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 300px;grid-template-rows:auto auto;gap:18px;align-items:stretch}
.cA{grid-column:1;grid-row:1/3}
.cB{grid-column:2;grid-row:1/3;display:flex;flex-direction:column}
.cC{grid-column:3;grid-row:1}
.cD{grid-column:3;grid-row:2}
.team-col{grid-column:4;grid-row:1/3;display:flex;flex-direction:column;gap:12px;padding:18px}

/* Ring */
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:rgba(255,255,255,.06)}
.ring-val{fill:none;stroke:var(--c);stroke-linecap:round;filter:drop-shadow(0 0 12px var(--g));animation:ringIn 1.4s var(--out) both}
.ring-knob{fill:#F2F5F1;stroke:var(--c);stroke-width:3;filter:drop-shadow(0 0 8px var(--g));animation:fadeIn .4s 1.1s both}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c b{font-size:52px;font-weight:300;letter-spacing:-.02em;line-height:1}
.ring-c b sup{font-size:20px;font-weight:300;vertical-align:top;margin-left:2px;position:relative;top:6px}
.ring-c span{font-size:12.5px;color:var(--muted);margin-top:8px}
@keyframes ringIn{from{stroke-dashoffset:var(--len)}}
@keyframes fadeIn{from{opacity:0}}

.cA-body{display:flex;flex-direction:column;align-items:center;gap:16px}
.cA-body .modes{flex-direction:row;padding:4px}
.cA-body .mode{padding:7px 14px}
.cA-body .mode i{display:none}
.cA-body .ring-c b{font-size:44px}
.ring-wrap{position:relative}
.ring-chip{position:absolute;top:2px;right:-6px;padding:6px 12px;border-radius:var(--r-pill);background:rgba(30,34,35,.85);border:1px solid var(--line-2);font-size:12px;color:var(--text-2);display:flex;gap:6px;align-items:center}
.ring-chip svg{width:13px;height:13px;color:var(--sage)}
.modes{display:flex;flex-direction:column;gap:8px;padding:6px;border-radius:var(--r-lg);background:var(--tile);border:1px solid var(--line)}
.mode{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:12.5px;white-space:nowrap;transition:all .25s var(--out)}
.mode i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2)}
.mode i svg{width:12px;height:12px}
.mode:hover{color:var(--text)}
.mode.on{background:var(--tile-3);color:var(--text);border-color:var(--line)}
.mode.on i{border-color:var(--sage);color:var(--sage)}

.free-tile{padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end}
.free-tile .t-label{font-size:12px;color:var(--muted)}
.free-tile b.big{display:block;font-size:34px;font-weight:300;line-height:1.1;margin-top:4px}
.free-tile b.big small{font-size:15px;color:var(--muted);margin-left:2px}
.free-tile .sub{font-size:12px;color:var(--muted)}
.minichart svg{width:100%;height:auto;display:block;overflow:visible}
.minichart .lbls{display:flex;justify-content:space-around;font-size:10.5px;color:var(--muted);margin-top:6px}

/* Mitarbeiter-Zeilen (wie Regler) */
.emp-rows{display:flex;flex-direction:column;gap:12px;overflow:auto;padding-right:2px;max-height:640px}
.emp-row{padding:14px 16px;cursor:pointer;transition:background .25s,border-color .25s,transform .3s var(--out)}
.emp-row:hover{background:var(--tile-2);border-color:var(--line-2);transform:translateY(-1px)}
.er-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.er-top b{font-weight:500;font-size:14.5px}
.er-top small{display:block;color:var(--muted);font-size:12px}
.er-val{display:flex;align-items:baseline;gap:6px;margin:8px 0 10px}
.er-val b{font-size:30px;font-weight:300;line-height:1;color:var(--text)}
.er-val span{font-size:14px;color:var(--muted)}
.er-val em{font-style:normal;margin-left:auto;font-size:12px;color:var(--muted)}
.slider{position:relative;height:6px;border-radius:var(--r-pill);background:rgba(255,255,255,.08)}
.slider .fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,.05),var(--c));box-shadow:0 0 14px var(--g);animation:growW 1s var(--out) both}
.slider .knob{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#F2F5F1;border:3px solid var(--c);box-shadow:0 0 10px var(--g);animation:fadeIn .4s .8s both}
.slider .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.25);border-radius:2px}
.sl-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}
@keyframes growW{from{width:0}}

/* 12-Monats-Diagramm */
.big-num{display:flex;align-items:baseline;gap:6px;margin:-4px 0 4px}
.big-num b{font-size:44px;font-weight:300;letter-spacing:-.02em;line-height:1}
.big-num span{color:var(--muted);font-size:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .lbl{fill:var(--muted);font-size:10.5px}
.ch-bar{fill:var(--cs);stroke:var(--c);stroke-width:1;transform-box:fill-box;transform-origin:bottom;animation:barUp .9s var(--out) both}
.ch-line{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.5;stroke-dasharray:3 4}
.ch-ref{stroke:rgba(255,255,255,.18);stroke-width:1;stroke-dasharray:4 5}
.ch-ref.over{stroke:rgba(232,137,123,.5)}
.ch-tag{font-size:10px;fill:var(--muted)}
@keyframes barUp{from{transform:scaleY(0)}}

/* Arc (Schnellplanung) */
.arc-wrap{position:relative;display:grid;place-items:center;margin:4px auto 0}
.arc-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:6px}
.arc-c b{font-size:44px;font-weight:300;line-height:1;letter-spacing:-.02em}
.arc-c b small{font-size:18px;color:var(--muted);margin-left:3px}
.arc-c span{font-size:12px;color:var(--muted);margin-top:8px;max-width:150px}
.arc-val{fill:none;stroke:var(--c);stroke-linecap:round;filter:drop-shadow(0 0 12px var(--g));transition:stroke-dashoffset .8s var(--out),stroke .4s}
.q-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-dates label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.q-dates input{padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);outline:none;font-size:13px}
.q-dates input:focus{border-color:rgba(168,209,154,.5)}
.q-ctrl{display:flex;align-items:center;justify-content:center;gap:18px;margin:-6px 0 14px}
.q-ctrl .round{width:48px;height:48px;font-size:22px}
.q-best{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.q-best b{color:var(--text);font-weight:500}

/* Team-Spalte (wie "Rooms & Nodes") */
.node{padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;position:relative;cursor:pointer;transition:background .25s,border-color .25s,transform .3s var(--out)}
.node:hover{background:var(--tile-2);border-color:var(--line-2);transform:translateY(-2px)}
.node .av{grid-row:1/4}
.node b{font-weight:500;font-size:14px;padding-right:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node small{color:var(--muted);font-size:12px}
.node .nd-dot{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.06);display:grid;place-items:center}
.node .nd-dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--g)}
.node .bar6{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
.node .bar6 i{height:22px;border-radius:7px;background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);position:relative;overflow:hidden}
.node .bar6 i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--c);opacity:.55}
.node .bar6-l{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:9.5px;color:var(--muted-2);text-align:center}
.team-col .card-h{margin-bottom:6px}
.team-scroll{display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:680px;padding-right:2px}

/* Avatar */
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:#151817;flex:none;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 55%),var(--a,#A8D19A)}
.av.sm{width:30px;height:30px;font-size:11px}
.av.lg{width:76px;height:76px;font-size:24px}

/* Heatmap-Zellen */
.hc{border-radius:12px;padding:8px 4px;text-align:center;background:var(--cs);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);font-variant-numeric:tabular-nums;transition:transform .2s var(--out),border-color .2s}
.hc b{display:block;font-size:13.5px;font-weight:600}
.hc small{display:block;font-size:10.5px;opacity:.8;color:var(--text-2)}
button.hc{cursor:pointer;width:100%;font:inherit}
button.hc:hover{transform:translateY(-2px);border-color:var(--c)}
.hc.with{outline:2px dashed var(--c);outline-offset:-3px}

/* Kapazitätsmatrix */
.matrix-scroll{overflow-x:auto;padding-bottom:4px}
.matrix{display:grid;grid-template-columns:minmax(200px,1.3fr) repeat(12,minmax(64px,1fr)) minmax(110px,.8fr);gap:6px;align-items:center;min-width:1100px}
.matrix .th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:4px 0}
.matrix .th.l{text-align:left}
.matrix .th.cur{color:var(--sage)}
.m-name{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;padding:6px;border-radius:14px}
.m-name:hover{background:var(--tile)}
.m-name b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-name small{color:var(--muted);font-size:12px}
.m-free{text-align:right;font-size:12.5px;color:var(--text-2);padding-right:6px}
.m-free small{display:block;color:var(--muted);font-size:11px}
.m-sep{grid-column:1/-1;height:1px;background:var(--line);margin:6px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:16px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-3px;margin-right:6px;background:var(--cs);border:1px solid var(--c)}
.month-nav{display:flex;align-items:center;gap:10px;padding:5px;border-radius:var(--r-pill);background:var(--tile);border:1px solid var(--line)}
.month-nav span{min-width:150px;text-align:center;font-size:13px;color:var(--text-2)}

/* Projekte – Zeitstrahl */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:18px}
.toolbar .input{width:auto}
.toolbar .grow{flex:1 1 220px}
.gantt-scroll{overflow-x:auto}
.gantt{--gl:300px;min-width:1100px;position:relative}
.g-row,.g-group,.g-head{display:grid;grid-template-columns:var(--gl) 1fr;align-items:center;position:relative}
.g-label{position:sticky;left:0;z-index:3;background:#1c2021;align-self:stretch;display:flex;align-items:center;gap:10px;padding-right:12px;min-width:0}
.g-track{position:relative;height:44px}
.g-months{height:32px}
.g-months span{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.g-body{position:relative}
.g-grid{position:absolute;inset:0 0 0 var(--gl);pointer-events:none}
.g-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-today{position:absolute;top:-30px;bottom:0;width:2px;margin-left:-1px;background:var(--amber);box-shadow:0 0 12px var(--amber-glow);z-index:2}
.g-today em{position:absolute;top:6px;left:6px;background:#1c2021;padding:1px 6px;border-radius:6px;font-style:normal;font-size:10px;font-weight:600;color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
.g-group{padding:14px 0 6px;border-top:1px solid var(--line);margin-top:6px}
.g-group .g-label b{font-weight:500}
.g-gmeta{font-size:12px;color:var(--muted);padding-left:12px}
.g-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.g-num{font-size:11px;color:var(--muted);padding:3px 8px;border-radius:8px;background:var(--tile-2);flex:none}
.g-bar{position:absolute;top:8px;height:28px;border-radius:10px;border:1px solid color-mix(in srgb,var(--sage) 50%,transparent);
  background:linear-gradient(90deg,rgba(168,209,154,.28),rgba(168,209,154,.12));cursor:pointer;display:flex;align-items:center;padding:0 10px;gap:6px;overflow:hidden;
  font-size:11.5px;color:var(--text);white-space:nowrap;transition:transform .2s var(--out),box-shadow .2s;transform-origin:left;animation:barIn .7s var(--out) both}
.g-bar:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.g-bar > *{position:relative}
.g-bar .g-fill{position:absolute;inset:0 auto 0 0;background:rgba(168,209,154,.32);border-radius:inherit}
.g-bar.closed{opacity:.45;background:rgba(255,255,255,.06);border-color:var(--line-2)}
.g-bar.closed .g-fill{display:none}
.g-bar.due{border-color:rgba(232,137,123,.7);background:linear-gradient(90deg,rgba(232,137,123,.25),rgba(232,137,123,.08))}
.g-bar.future{background:linear-gradient(90deg,rgba(235,190,120,.22),rgba(235,190,120,.08));border-color:rgba(235,190,120,.45)}
@keyframes barIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* Projekt-Liste */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:860px}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line)}
.tbl tbody tr{cursor:pointer;transition:background .2s}
.tbl tbody tr:hover{background:var(--tile)}
.tbl .r{text-align:right}
.tbl tr:last-child td{border-bottom:0}

/* Übersicht (neu): Kennzahlen, Mitarbeiter-Liste, Hinweise */
.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(330px,1fr);gap:18px;align-items:start}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.kpi{padding:18px 20px;display:flex;gap:14px;align-items:center;cursor:default}
.kpi[data-action]{cursor:pointer}
.kpi[data-action]:hover{border-color:var(--line-2)}
.kpi .ic{width:46px;height:46px}
.kpi .ic svg{width:20px;height:20px}
.kpi span.l{display:block;font-size:12px;color:var(--muted)}
.kpi b.v{display:block;font-size:30px;font-weight:300;line-height:1.15;letter-spacing:-.01em}
.kpi small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.alert{border-color:rgba(232,137,123,.45);background:linear-gradient(180deg,rgba(232,137,123,.14),rgba(232,137,123,.04))}
.kpi.alert .ic{border-color:rgba(232,137,123,.5);color:var(--red)}
.kpi.alert b.v{color:var(--red)}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.main-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.bottom{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,1.7fr);gap:18px;align-items:stretch}
.bottom > .card,.side > .card{grid-column:auto;grid-row:auto}   /* alte Rasterpositionen der früheren Übersicht aufheben */
.bottom .cA{display:flex;flex-direction:column;justify-content:center}

.ulist-h,.urow{display:grid;grid-template-columns:auto minmax(130px,1.2fr) 96px minmax(250px,2.2fr) minmax(130px,1fr) auto;gap:14px;align-items:center}
.ulist-h{padding:0 14px 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ulist-h .mh{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;text-align:center}
.urow{padding:12px 14px;cursor:pointer;transition:background .25s,border-color .25s,transform .3s var(--out)}
.urow + .urow{margin-top:8px}
.urow:hover{background:var(--tile-2);border-color:var(--line-2);transform:translateX(2px)}
.urow.is-over{border-color:rgba(232,137,123,.45);background:linear-gradient(90deg,rgba(232,137,123,.12),rgba(255,255,255,.03))}
.urow .who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow .who small{color:var(--muted);font-size:12px}
.urow .now b{font-size:24px;font-weight:300;color:var(--c);line-height:1}
.urow .now small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.urow .m6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.urow .m6 .hc{padding:6px 2px;border-radius:9px}
.urow .m6 .hc b{font-size:11.5px}
.urow .m6 .hc small{display:none}
@media (max-width:1100px){ .urow .m6 .hc small{display:block} }
.urow .st{font-size:12px;color:var(--text-2);line-height:1.3}
.urow .st b{display:block;font-weight:500;color:var(--c)}

.alerts .al-sec + .al-sec{margin-top:16px}
.alerts h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.al-row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .2s}
.al-row + .al-row{margin-top:6px}
.al-row:hover{background:var(--tile-2)}
.al-row .who{flex:1;min-width:0}
.al-row .who b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-row .who small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-row .val{font-weight:600;font-size:13px;color:var(--c);white-space:nowrap}
.all-good{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-md);background:var(--sage-soft);color:var(--sage)}

/* Stunden Ist / Budget */
.hrs{display:flex;flex-direction:column;gap:5px;min-width:130px}
.hrs .top{display:flex;align-items:center;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.hrs .top b{font-weight:500;color:var(--c)}
.hrs .top span{color:var(--muted)}
.hrs .hb{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.hrs .hb i{display:block;height:100%;background:var(--c);border-radius:inherit}
.ist-in{width:72px!important;padding:5px 8px!important;border-radius:9px!important;font-size:12.5px!important;text-align:right;border:1px solid var(--line)!important;background:rgba(255,255,255,.05)!important;outline:none}
.ist-in:focus{border-color:rgba(168,209,154,.6)!important}

/* Projektleiter-Auswahl im Projektformular */
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.035);cursor:pointer;transition:all .2s var(--out)}
.pick-opt:hover{border-color:var(--line-2);background:var(--tile-2)}
.pick-opt input{position:absolute;opacity:0;pointer-events:none}
.pick-opt .po-t{flex:1;min-width:0}
.pick-opt .po-t b{display:block;font-weight:500;font-size:13.5px}
.pick-opt .po-t small{display:block;color:var(--muted);font-size:11.5px}
.pick-opt:has(input:checked){border-color:var(--c);background:var(--cs);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.pick-opt.no{opacity:.6}
.pick-opt.no:has(input:checked){opacity:1}
.pick-sep{font-size:11.5px;color:var(--red);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.pick-sep::after{content:"";flex:1;height:1px;background:rgba(232,137,123,.3)}
.pl-locked{display:flex;align-items:center;gap:14px;padding:12px 14px;border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.pl-locked .who{flex:1;min-width:0}
.pl-locked .who b{display:block;font-weight:500;font-size:15px}
.pl-locked .who small{color:var(--muted);font-size:12px}
.pl-keep{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.pl-keep b{color:var(--text);font-weight:500}
.pick.invalid-box{outline:1px solid var(--red);outline-offset:6px;border-radius:12px}

/* Fortschritts-Regler */
.prog{display:flex;align-items:center;gap:10px;min-width:170px}
.prog .track{position:relative;flex:1;display:flex;align-items:center}
.prog input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:var(--r-pill);margin:8px 0;cursor:pointer;outline:none;
  background:linear-gradient(90deg,var(--sage) 0,var(--sage) var(--v),rgba(255,255,255,.1) var(--v))}
.prog input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#F2F5F1;border:3px solid var(--sage);box-shadow:0 0 10px var(--sage-glow);transition:transform .2s var(--spring)}
.prog input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
.prog input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#F2F5F1;border:3px solid var(--sage)}
.prog input[type=range]:disabled{opacity:.45;cursor:default}
.prog .tmark{position:absolute;top:50%;width:2px;height:16px;margin:-8px 0 0 -1px;background:var(--amber);border-radius:2px;pointer-events:none;box-shadow:0 0 6px var(--amber-glow)}
.prog b{font-weight:500;font-size:12.5px;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.prog.behind b{color:var(--amber)}
.prog.big{min-width:0}
.prog.big b{font-size:16px;min-width:52px}

/* Abschlüsse */
.results{display:grid;grid-template-columns:320px minmax(0,1fr) 300px;gap:18px;align-items:start}
.rank-row{display:grid;grid-template-columns:auto minmax(120px,.8fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;padding:12px 14px;cursor:pointer;transition:background .25s,border-color .25s}
.rank-row + .rank-row{margin-top:10px}
.rank-row:hover{background:var(--tile-2);border-color:var(--line-2)}
.rank-row b{font-weight:500}
.rank-row small{display:block;color:var(--muted);font-size:12px}
.rank-row .avg{font-size:22px;font-weight:300;color:var(--c);text-align:right;min-width:86px}
.dots{position:relative;height:30px;border-radius:10px;background:rgba(255,255,255,.04)}
.dots .zone{position:absolute;top:0;bottom:0}
.dots .d{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--g);border:2px solid #1d2122;animation:fadeIn .5s both}
.dots .am{position:absolute;top:3px;bottom:3px;width:3px;margin-left:-1.5px;border-radius:3px;background:#F2F5F1}
.scale-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted-2);margin:6px 0 0}
.stat-list{display:flex;flex-direction:column;gap:10px}
.stat{padding:14px 16px}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-size:22px;font-weight:300}
.stat small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.due-row{display:flex;align-items:center;gap:10px;padding:10px 12px}
.due-row + .due-row{margin-top:8px}
.due-row .who{flex:1;min-width:0}
.due-row .who b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-row .who small{color:var(--muted);font-size:11.5px}
.closed-box{padding:12px 14px;border-radius:var(--r-md);background:var(--cs);color:var(--c);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.closed-box b{font-size:20px;font-weight:400}
.closed-box span{color:var(--text-2);font-size:13px}

/* Planer */
.planner{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;align-items:start}
.cand{padding:16px;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:14px;align-items:center;transition:background .25s,border-color .25s}
.cand + .cand{margin-top:12px}
.cand:hover{background:var(--tile-2);border-color:var(--line-2)}
.cand .rank{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--tile-2);border:1px solid var(--line);color:var(--muted)}
.cand.best .rank{background:var(--sage);color:#142014;border-color:transparent;box-shadow:0 0 18px var(--sage-glow)}
.cand .who b{font-weight:500;font-size:15px}
.cand .who small{display:block;color:var(--muted);font-size:12px}
.cand .strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(var(--n),minmax(54px,1fr));gap:6px;overflow-x:auto}
.cand .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.cand .meta b{color:var(--text);font-weight:500}
.plan-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.plan-sum div{padding:12px 14px;border-radius:var(--r-md);background:var(--tile);border:1px solid rgba(255,255,255,.05)}
.plan-sum span{display:block;font-size:11.5px;color:var(--muted)}
.plan-sum b{font-size:20px;font-weight:400}
.stepper{display:flex;align-items:center;gap:10px}
.stepper input{text-align:center}

/* Team-Ansicht */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.tcard{padding:20px;cursor:pointer;transition:transform .3s var(--out),border-color .3s}
.tcard:hover{transform:translateY(-3px);border-color:var(--line-2)}
.tcard-h{display:flex;align-items:center;gap:14px}
.tcard-h b{font-weight:500;font-size:16px}
.tcard-h small{display:block;color:var(--muted);font-size:12.5px}
.tcard-h .right{margin-left:auto;display:flex;gap:6px}
.strip12{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:16px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kv div{padding:10px 12px;border-radius:14px;background:var(--tile);border:1px solid rgba(255,255,255,.05)}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-weight:500;font-size:15px}

/* Mitarbeiter-Detail */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 0;margin-bottom:10px}
.back:hover{color:var(--text)}
.back svg{width:16px;height:16px}
.emp-hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.emp-hero h1{font-size:34px;font-weight:300}
.emp-hero p{color:var(--muted);margin-top:4px}
.detail{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}

/* Ersteinrichtung */
.setup{max-width:860px;display:flex;flex-direction:column;gap:16px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px}
.step-no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--tile-2);border:1px solid var(--line-2);color:var(--sage)}
.step.done .step-no{background:var(--sage);color:#142014;border-color:transparent;box-shadow:0 0 18px var(--sage-glow)}
.step h3{font-size:17px;font-weight:500}
.step > div > p{color:var(--muted);font-size:13px;margin:4px 0 14px}
.setup-add{display:grid;grid-template-columns:1.3fr 1.2fr 150px auto;gap:10px;align-items:end}
.linkish{border:0;background:none;color:var(--sage);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 12px}
.row-item + .row-item{margin-top:8px}
.row-item .who{flex:1;min-width:0}
.row-item .who b{font-weight:500;display:block}
.row-item .who small{color:var(--muted);font-size:12px}

/* Modal */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(6,8,8,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.overlay.leaving{pointer-events:none}
.modal{width:100%;max-width:580px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:linear-gradient(180deg,#22272a,#1a1e1f);border:1px solid var(--line-2);border-radius:var(--r-xl);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.modal.lg{max-width:820px}
.modal-h{display:flex;justify-content:space-between;gap:16px;padding:22px 24px 12px}
.modal-h h2{font-size:20px;font-weight:400}
.modal-h p{color:var(--muted);font-size:13px;margin-top:3px}
.modal-b{padding:6px 24px 18px;overflow:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .spacer{margin-right:auto}
.impact{display:grid;grid-template-columns:110px repeat(var(--n),minmax(54px,1fr));gap:6px;align-items:center;overflow-x:auto}
.impact .il{font-size:12px;color:var(--muted)}
.impact .ih{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase}
.note{margin-top:12px;padding:10px 14px;border-radius:var(--r-md);font-size:13px;background:var(--cs);color:var(--c)}

/* Login & Laden */
body.locked .app{display:none}
.gate{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:420px;padding:34px 30px;animation:rise .6s var(--out) both}
.login-card .logo{justify-content:center;margin-bottom:18px;min-width:0}
.login-card h1{font-size:28px;font-weight:300;text-align:center}
.login-card p.sub{color:var(--muted);text-align:center;margin:6px 0 24px}
.login-card .btn-primary{width:100%;padding:13px;margin-top:6px}
.login-card .linkish{display:block;margin:16px auto 0;font-size:13px}
.spinner{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--sage);animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-text{text-align:center;color:var(--muted)}
.boot-err{max-width:520px;text-align:center}
.boot-err p{color:var(--muted);margin:10px 0 18px}
/* Sicherungsliste */
.bk-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;padding-right:2px}
.bk-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05)}
.bk-row .who{flex:1;min-width:0}
.bk-row .who b{display:block;font-weight:500;font-size:13px}
.bk-row .who small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Speicherstatus */
.sync{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r-pill);background:var(--tile);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--sage);box-shadow:0 0 8px var(--sage-glow)}
.sync.saving i{background:var(--amber);box-shadow:0 0 8px var(--amber-glow);animation:fadeIn .8s ease-in-out infinite alternate}
.sync.err i{background:var(--red);box-shadow:0 0 8px var(--red-glow)}
@media (max-width:820px){ .sync span{display:none} }

/* Toasts */
#toast-root{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r-lg);background:rgba(36,41,43,.96);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:13.5px;animation:slideUp .35s var(--out);max-width:380px}
.toast i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:#142014;font-style:normal;font-weight:700;font-size:12px;flex:none}
.toast.warn i{background:var(--amber)}
.toast.err i{background:var(--red)}
.toast.out{opacity:0;transform:translateY(8px);transition:all .25s}

/* Animationen */
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dx,40px))}}
.view-in{animation:viewIn .5s var(--out) both}
.view-in .glass,.view-in .anim{animation:rise .6s var(--out) both;animation-delay:calc(var(--i,0) * 60ms + 60ms)}
.flash{animation:flash 1.2s var(--out)}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--sage-glow)}60%{box-shadow:0 0 0 14px rgba(168,209,154,0)}}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);pointer-events:none;animation:ripple .6s var(--out) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

/* =========================================================
   5. Responsive
   ========================================================= */
@media (max-width:1360px){
  .home{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cA{grid-column:1;grid-row:1}
  .cB{grid-column:2;grid-row:1/3}
  .cC{grid-column:1;grid-row:2}
  .cD{grid-column:1;grid-row:3}

  .pick{grid-template-columns:1fr}

  .rail .sep,.rail .tip{display:none}
  main#view{padding:6px 16px 110px}

  .modes{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .emp-hero{grid-template-columns:auto 1fr}
  .emp-hero .right{grid-column:1/-1}
}

/* Startbesetzung: eigenes Team, Kevin Frei als Chef (Benutzer des Programms) */
function seedState(){
  return {
    employees: ['Valentin Flury', 'Egzon Isufi', 'Mark Mettler', 'Nicola Jundt'].map((name, i) => ({ id: 'pl' + (i + 1), name, role: 'Projektleiter', hours: 160, color: COLORS[i] })),
    projects: [],
    settings: { ...DEFAULTS, userName: 'Kevin Frei' }
  };
}
function normalize(d){
  return {
    settings: { ...DEFAULTS, ...((d && d.settings) || {}) },
    employees: (d && Array.isArray(d.employees) ? d.employees : []).filter(e => e && e.id && e.name).map((e, i) => ({
      id: String(e.id), name: String(e.name), role: String(e.role || ''), hours: num(e.hours) || DEFAULTS.defaultHours, color: e.color || COLORS[i % COLORS.length]
    })),
    projects: (d && Array.isArray(d.projects) ? d.projects : []).filter(p => p && p.id).map(p => ({
      id: String(p.id), number: String(p.number || ''), name: String(p.name || 'Projekt'), employeeId: p.employeeId ? String(p.employeeId) : '',
      hours: num(p.hours), start: String(p.start || ''), end: String(p.end || ''), note: String(p.note || ''),
      progress: Math.max(0, Math.min(100, Math.round(num(p.progress)))),
      istStd: Math.max(0, num(p.istStd)),
      closed: !!p.closed, closedAt: String(p.closedAt || ''),
      finalDB: p.finalDB === '' || p.finalDB == null || !isFinite(+p.finalDB) ? null : +p.finalDB,
      closeNote: String(p.closeNote || '')
    }))
  };
}
/* =========================================================
   Cloud: Firebase Authentication + Firestore
   Daten liegen im Dokument  cockpit/{uid}  (Feld "json").
   Lokaler Speicher dient nur als Zwischenspeicher pro Benutzer.
   ========================================================= */
let cloudUser = null;        // angemeldeter Benutzer
let cloudReady = false;      // erst nach erfolgreichem Laden darf gespeichert werden
let lastSyncedJson = '';     // zuletzt mit der Cloud abgeglichener Stand
let saveTimer = null, unsubSnap = null, pendingRemote = null;
const cacheKey = () => `${STORE_KEY}:${cloudUser ? cloudUser.uid : 'anon'}`;

function setSync(st){
  const el = document.getElementById('sync'); if(!el) return;
  el.className = 'sync ' + (st === 'ok' ? '' : st);
  el.querySelector('span').textContent = st === 'saving' ? 'Speichert …' : st === 'err' ? 'Nicht gespeichert' : 'Gespeichert';
  el.title = st === 'err' ? 'Speichern in der Cloud fehlgeschlagen – Daten sind lokal zwischengespeichert' : 'Daten sind in der Cloud gespeichert';
}
async function flushSave(){
  clearTimeout(saveTimer); saveTimer = null;
  if(!cloudReady || !cloudUser || !window.Cloud) return;
  const json = JSON.stringify(state);
  if(json === lastSyncedJson){ setSync('ok'); return; }
  try{
    await Cloud.setDoc(Cloud.docRef(cloudUser.uid), { json, version: 2, updatedAt: Cloud.serverTimestamp(), by: cloudUser.email || '' });
    lastSyncedJson = json; setSync('ok');
    if(lastBackupDay !== todayISO()) dailyBackup();       // App über Mitternacht offen
  }catch(e){
    console.error('Cloud-Speichern fehlgeschlagen', e); setSync('err');
    toast('Speichern in der Cloud fehlgeschlagen – lokal zwischengespeichert. Nächster Versuch beim nächsten Speichern.', 'err');
  }
}
function save(){
  distCache.clear();
  if(!cloudReady) return;      // nie speichern, bevor die Cloud-Daten geladen sind (schützt vor Überschreiben)
  pendingRemote = null;        // eigene Änderung hat Vorrang vor zurückgehaltener Fremdänderung
  try{ localStorage.setItem(cacheKey(), JSON.stringify(state)); }catch(e){}
  setSync('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 500);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && saveTimer) flushSave(); });
window.addEventListener('beforeunload', ev => { if(saveTimer){ flushSave(); ev.preventDefault(); ev.returnValue = ''; } });

/* =========================================================
   Automatische Sicherung (Firestore: cockpit/{uid}/backups/{id})
   - täglich: erster Stand des Tages (d-JJJJ-MM-TT), 30 Tage aufbewahrt
   - vor riskanten Aktionen (Löschen, Import, Demo, Wiederherstellen), 15 aufbewahrt
   ========================================================= */
const BACKUP_KEEP_DAILY = 30, BACKUP_KEEP_EVENT = 15;
let lastBackupDay = '';
async function createBackup(reason, daily){
  if(!cloudUser || !cloudReady || !window.Cloud) throw new Error('nicht angemeldet');
  const now = new Date();
  const id = daily ? `d-${todayISO()}` : `e-${todayISO()}T${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
  await Cloud.setDoc(Cloud.backupDoc(cloudUser.uid, id), {
    json: JSON.stringify(state), reason, clientAt: now.toISOString(), createdAt: Cloud.serverTimestamp(),
    employees: state.employees.length, projects: state.projects.length
  });
  pruneBackups();
  return id;
}
async function listBackups(){
  const qs = await Cloud.getDocs(Cloud.backupCol(cloudUser.uid));
  return qs.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.clientAt || '').localeCompare(a.clientAt || ''));
}
async function pruneBackups(){
  try{
    const all = await listBackups();
    const old = all.filter(b => b.id.startsWith('d-')).slice(BACKUP_KEEP_DAILY).concat(all.filter(b => !b.id.startsWith('d-')).slice(BACKUP_KEEP_EVENT));
    for(const b of old) await Cloud.deleteDoc(Cloud.backupDoc(cloudUser.uid, b.id));
  }catch(e){ console.warn('Alte Sicherungen konnten nicht entfernt werden', e); }
}
/* einmal pro Tag den Stand sichern (beim Öffnen bzw. beim ersten Speichern nach Mitternacht) */
async function dailyBackup(){
  const day = todayISO();
  if(lastBackupDay === day || !cloudReady) return;
  lastBackupDay = day;
  try{
    const s = await Cloud.getDoc(Cloud.backupDoc(cloudUser.uid, `d-${day}`));
    if(!s.exists()) await createBackup('Tägliche Sicherung', true);
  }catch(e){ lastBackupDay = ''; console.warn('Tägliche Sicherung fehlgeschlagen', e); }
}
/* Sicherung vor riskanter Aktion – bei Fehler wird die Aktion abgebrochen */
async function safeguard(reason){
  try{ await createBackup(reason, false); return true; }
  catch(e){ console.error(e); toast('Sicherung fehlgeschlagen – Vorgang abgebrochen, es wurde nichts verändert', 'err'); return false; }
}
function fmtDateTime(isoStr){
  const d = new Date(isoStr); if(isNaN(d)) return '–';
  return d.toLocaleDateString('de-CH', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }) + ', ' + d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
}
function downloadJSON(json, name){
  const blob = new Blob([json], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function renderBackupList(box){
  box.innerHTML = '<p class="hint" style="margin:0">Sicherungen werden geladen …</p>';
  try{
    const list = await listBackups();
    box._list = list;
    box.innerHTML = list.length ? `<div class="bk-list">${list.map(b => `<div class="bk-row">
        <span class="ic" style="width:32px;height:32px">${b.id.startsWith('d-') ? I.cal : I.flag}</span>

        <button type="button" class="round sm" title="Als JSON herunterladen" data-bk="dl" data-id="${b.id}">${I.down}</button>
        <button type="button" class="btn btn-sm" data-bk="restore" data-id="${b.id}">Wiederherstellen</button></div>`).join('')}</div>`
      : '<p class="hint" style="margin:0">Noch keine Sicherungen vorhanden.</p>';
  }catch(e){
    console.error(e);
    box.innerHTML = `<div class="note l-over" style="margin:0">Sicherungen konnten nicht geladen werden (${esc(e.code || e.message)}). Bitte die Firestore-Regeln aktualisieren (Abschnitt „backups“).</div>`;
  }
}
async function restoreBackup(b){
  if(!(await safeguard('Vor Wiederherstellung'))) return;
  state = normalize(JSON.parse(b.json)); distCache.clear();
  save(); closeModal(); render({ anim: true });

/* Anzeige: Laden / Login / Fehler / App */
function gate(mode, text){
  const g = document.getElementById('gate');
  document.body.classList.toggle('locked', mode !== 'app');
  g.hidden = mode === 'app';
  document.getElementById('boot').hidden = mode !== 'boot';
  document.getElementById('login').hidden = mode !== 'login';
  document.getElementById('boot-err').hidden = mode !== 'error';
  if(mode === 'boot') document.getElementById('boot-text').textContent = text || 'Lade …';
  if(mode === 'error') document.getElementById('boot-err').innerHTML = `<div class="ic" style="margin:0 auto 12px;color:var(--red)">${I.bell}</div><h3>Keine Verbindung</h3><p>${text}</p>
    <div style="display:flex;gap:10px;justify-content:center"><button class="btn" onclick="location.reload()">Neu laden</button>${cloudUser ? '<button class="btn" id="err-logout">Abmelden</button>' : ''}</div>`;
  const lo = document.getElementById('err-logout'); if(lo) lo.onclick = () => Cloud.signOut();
  if(mode === 'login') setTimeout(() => document.getElementById(document.getElementById('li-email').value ? 'li-pw' : 'li-email').focus(), 50);
}
function bootCloud(){
  gate('boot', 'Verbindung wird aufgebaut …');
  const start = () => Cloud.onAuth(onAuthChanged);
  if(window.Cloud) start();
  else {
    window.addEventListener('cloud-ready', start, { once: true });
    setTimeout(() => { if(!window.Cloud) gate('error', 'Firebase konnte nicht geladen werden. Bitte Internetverbindung prüfen – die Seite muss über https (z. B. GitHub Pages) geöffnet werden.'); }, 12000);
  }
}
async function onAuthChanged(user){
  if(unsubSnap){ unsubSnap(); unsubSnap = null; }
  cloudReady = false; cloudUser = user; lastSyncedJson = ''; lastBackupDay = '';
  if(!user){ closeModal(true); gate('login'); return; }
  gate('boot', 'Daten werden geladen …');
  try{
    const ref = Cloud.docRef(user.uid);
    const snap = await Cloud.getDoc(ref);
    if(snap.exists() && snap.data().json){
      state = normalize(JSON.parse(snap.data().json));
      lastSyncedJson = snap.data().json;
      cloudReady = true;
    } else {
      // erste Anmeldung: vorhandene lokale Daten übernehmen, sonst Startbesetzung
      let local = null;
      try{ local = localStorage.getItem(cacheKey()) || localStorage.getItem(STORE_KEY); }catch(e){}
      state = local ? normalize(JSON.parse(local)) : seedState();
      cloudReady = true;
      save(); await flushSave();
      toast(local ? 'Bisherige Daten aus diesem Browser in die Cloud übernommen' : 'Willkommen – dein Team ist angelegt');
    }
    distCache.clear();
    // Änderungen von anderen Geräten übernehmen
    unsubSnap = Cloud.onSnapshot(ref, s => {
      if(!s.exists() || s.metadata.hasPendingWrites) return;
      const json = s.data().json;
      if(!json || json === lastSyncedJson || json === JSON.stringify(state)){ lastSyncedJson = json || lastSyncedJson; return; }
      if(curOverlay){ pendingRemote = json; return; }      // nicht mitten in einer Bearbeitung austauschen
      applyRemote(json);
    }, err => { console.error(err); setSync('err'); });
    gate('app'); setSync('ok');
    render({ anim: true });
    dailyBackup();
  }catch(e){
    console.error('Laden fehlgeschlagen', e);
    gate('error', e && e.code === 'permission-denied'
      ? 'Zugriff verweigert. Bitte die Firestore-Regeln prüfen (Lesen/Schreiben für den angemeldeten Benutzer auf cockpit/{uid}).'
      : `Daten konnten nicht geladen werden (${esc((e && (e.code || e.message)) || 'unbekannter Fehler')}).`);
  }
}
function applyRemote(json){
  pendingRemote = null; lastSyncedJson = json;
  state = normalize(JSON.parse(json)); distCache.clear();
  render(); toast('Daten wurden von einem anderen Gerät aktualisiert');
}

/* =========================================================
   Helfer
   ========================================================= */
function num(v){ const n = parseFloat(String(v ?? '').replace(/['\s]/g, '').replace(',', '.')); return isFinite(n) ? n : 0; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, isFinite(v) ? v : 0));
const pad = n => String(n).padStart(2, '0');
const parseD = s => new Date(s + 'T00:00:00');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const todayISO = () => iso(today0());
const mKey = (y, m) => `${y}-${pad(m + 1)}`;
const fmtH = v => `${Math.round(v || 0).toLocaleString('de-CH')} h`;
const fmtP = v => `${Math.round(v || 0)} %`;
const fmtDate = s => s ? parseD(s).toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '–';
const initials = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const empById = id => state.employees.find(e => e.id === id) || null;
const projById = id => state.projects.find(p => p.id === id) || null;
const S = () => state.settings;
function avatar(e, cls = ''){ return `<span class="av ${cls}" style="--a:${e ? e.color : '#666'}">${e ? esc(initials(e.name)) : '?'}</span>`; }

/* Monatsliste ab heute + Offset */
function months(offset, n){
  const t = today0(), out = [];
  for(let i = 0; i < n; i++){
    const d = new Date(t.getFullYear(), t.getMonth() + offset + i, 1);
    out.push({ key: mKey(d.getFullYear(), d.getMonth()), y: d.getFullYear(), m: d.getMonth(), date: d,
      label: `${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`, short: MONTHS[d.getMonth()], long: `${MONTHS_L[d.getMonth()]} ${d.getFullYear()}`,
      current: offset + i === 0 });
  }
  return out;
}
const curKey = () => { const t = today0(); return mKey(t.getFullYear(), t.getMonth()); };

/* =========================================================
   Auslastungs-Berechnung
   Die Projektleiter-Stunden eines Projekts werden gleichmässig auf alle
   Arbeitstage (Mo–Fr) zwischen Baustart und Fertigstellung verteilt.
   ========================================================= */
const distCache = new Map();
function projectMonths(p){
  const k = `${p.start}|${p.end}|${p.hours}|${p.closed ? p.closedAt : ''}`;
  if(distCache.has(k)) return distCache.get(k);
  const map = {};
  if(p.start && p.end && p.hours > 0){
    let a = parseD(p.start), b = parseD(p.end);
    if(b < a) [a, b] = [b, a];
    const counts = {}; let total = 0;
    for(let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)){
      const wd = d.getDay(); if(wd === 0 || wd === 6) continue;
      const key = mKey(d.getFullYear(), d.getMonth()); counts[key] = (counts[key] || 0) + 1; total++;
    }
    if(!total){ counts[mKey(a.getFullYear(), a.getMonth())] = 1; total = 1; }
    for(const key in counts) map[key] = p.hours * counts[key] / total;
    // Abgeschlossen: Stunden nach dem Abschlussmonat belasten niemanden mehr
    if(p.closed && p.closedAt){ const ck = p.closedAt.slice(0, 7); for(const key in map) if(key > ck) delete map[key]; }
  }
  distCache.set(k, map);
  return map;
}
/* gebuchte Stunden eines Mitarbeiters im Monat · opts.extra: zusätzliches (geplantes) Projekt, opts.excludeId */
function load_(e, key, opts = {}){
  let h = 0;
  for(const p of state.projects){ if(p.employeeId === e.id && p.id !== opts.excludeId) h += projectMonths(p)[key] || 0; }
  if(opts.extra) h += projectMonths(opts.extra)[key] || 0;
  return h;
}
function util(e, key, opts){ return e.hours > 0 ? load_(e, key, opts) / e.hours * 100 : 0; }
function lvl(u){ u = Math.round(u); if(u <= 0) return 'none'; if(u > 100) return 'over'; if(u >= S().fullLoad) return 'full'; if(u >= 50) return 'good'; return 'low'; }
const LVL = { none: 'frei', low: 'wenig ausgelastet', good: 'gut ausgelastet', full: 'voll', over: 'überlastet' };
function teamMonth(key){
  let loadH = 0, cap = 0;
  state.employees.forEach(e => { loadH += load_(e, key); cap += e.hours; });
  return { load: loadH, cap, util: cap ? loadH / cap * 100 : 0, free: Math.max(cap - loadH, 0) };
}
/* ab wann dauerhaft Kapazität frei ist: Monat nach dem letzten "vollen" Monat (Blick 24 Monate) */
function freeFrom(e){
  const ms = months(0, 24);
  let last = -1;
  ms.forEach((x, i) => { if(Math.round(util(e, x.key)) >= S().fullLoad) last = i; });
  if(last < 0) return 'ab sofort';
  if(last >= ms.length - 1) return 'nicht in 24 Mt.';
  return `ab ${ms[last + 1].long}`;
}
function projStatus(p){
  if(p.closed) return 'closed';
  const t = todayISO();
  if(p.end && p.end < t) return 'due';          // Enddatum vorbei, aber noch nicht abgeschlossen
  if(p.start && p.start > t) return 'future';
  return 'run';
}
const PSTAT = { run: 'Laufend', future: 'Geplant', due: 'Abschliessen', closed: 'Abgeschlossen' };
const PSTAT_LV = { run: 'good', future: 'full', due: 'over', closed: 'none' };
/* verstrichene Zeit in % (für Vergleich mit dem Fortschritt) */
function timePct(p){
  if(!p.start || !p.end) return null;
  const a = parseD(p.start), b = parseD(p.end), t = today0();
  if(b <= a) return t >= b ? 100 : 0;
  return clamp((t - a) / (b - a) * 100);
}
/* Aufgewendete PL-Stunden vs. Budget: over = mehr als budgetiert, warn = Stunden laufen dem Fortschritt davon */
function hoursState(p){
  if(!(p.hours > 0) || !(p.istStd > 0)) return 'ok';
  const r = p.istStd / p.hours * 100;
  if(r > 100) return 'over';
  if(!p.closed && r > p.progress + 15) return 'warn';
  return 'ok';
}
const HSL = { ok: 'good', warn: 'full', over: 'over' };
function hrsCell(p, editable){
  const r = p.hours > 0 ? p.istStd / p.hours * 100 : 0, s = hoursState(p);
  return `<div class="hrs l-${p.istStd > 0 ? HSL[s] : 'none'}" title="${fmtH(p.istStd)} von ${fmtH(p.hours)} aufgewendet (${fmtP(r)})${s === 'warn' ? ' – mehr Stunden verbraucht als Fortschritt' : s === 'over' ? ' – Budget überschritten' : ''}">
    <div class="top">${editable ? `<input class="ist-in" type="number" min="0" step="1" value="${p.istStd || ''}" placeholder="0" data-ist="${p.id}" aria-label="Aufgewendete Stunden">` : `<b>${fmtH(p.istStd)}</b>`}<span>/ ${fmtH(p.hours)}</span><b data-ist-p="${p.id}" style="margin-left:auto">${p.istStd > 0 ? fmtP(r) : ''}</b></div>
    <div class="hb"><i style="width:${clamp(r)}%"></i></div></div>`;
}
/* DB-Bewertung abgeschlossener Projekte */
function dbLvl(db){ if(db == null || !isFinite(db)) return 'none'; return db >= S().dbGood ? 'good' : db >= S().dbBad ? 'full' : 'over'; }
const DBL = { good: 'gut', full: 'mittel', over: 'kritisch', none: '–' };
const fmtDB = v => v == null || !isFinite(v) ? '–' : `${v.toLocaleString('de-CH', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} %`;
const closedOf = list => list.filter(p => p.closed && p.finalDB != null);
const avgDB = list => { const c = closedOf(list); return c.length ? c.reduce((s, p) => s + p.finalDB, 0) / c.length : null; };
/* Fortschritts-Regler mit Markierung der verstrichenen Zeit */
function progSlider(p){
  const tp = timePct(p), behind = !p.closed && tp != null && tp - p.progress > 15;
  return `<div class="prog ${behind ? 'behind' : ''}" title="Fortschritt ${p.progress} % · Zeit verstrichen ${tp == null ? '–' : Math.round(tp) + ' %'}">
    <span class="track"><input type="range" min="0" max="100" step="5" value="${p.progress}" data-progress="${p.id}" style="--v:${p.progress}%" ${p.closed ? 'disabled' : ''} aria-label="Fortschritt ${esc(p.name)}">
    ${tp != null && !p.closed ? `<i class="tmark" style="left:${tp}%"></i>` : ''}</span>
    <b data-prog-l="${p.id}">${p.progress} %</b></div>`;
}
function empProjects(e){ return state.projects.filter(p => p.employeeId === e.id); }
function nextNumber(){
  const pre = S().numberPrefix; let max = 0;
  state.projects.forEach(p => { if(p.number.startsWith(pre)){ const r = p.number.slice(pre.length); if(/^\d+$/.test(r)) max = Math.max(max, +r); } });
  return pre + String(max + 1).padStart(3, '0');
}
function workMonths(p){ const m = projectMonths(p); return Object.keys(m).length; }

/* Kandidaten für ein neues Projekt bewerten ("Wer macht was?") */
function rankCandidates(draft, excludeId){
  const keys = Object.keys(projectMonths(draft)).sort();
  return state.employees.map(e => {
    const d = { ...draft, employeeId: e.id, id: '__draft' };
    const rows = keys.map(k => { const base = util(e, k, { excludeId }), w = util(e, k, { excludeId, extra: d }); return { key: k, base, with: w, load: load_(e, k, { excludeId, extra: d }) }; });
    const peak = rows.length ? Math.max(...rows.map(r => r.with)) : 0;
    const basePeak = rows.length ? Math.max(...rows.map(r => r.base)) : 0;
    const free = keys.reduce((s, k) => s + Math.max(e.hours - load_(e, k, { excludeId }), 0), 0);
    const verdict = peak <= S().fullLoad ? 'good' : peak <= 100 ? 'full' : 'over';
    return { e, rows, peak, basePeak, free, verdict };
  }).sort((a, b) => a.peak - b.peak || b.free - a.free);
}
const VERDICT = { good: 'passt gut', full: 'knapp', over: 'überlastet' };

/* =========================================================
   Grafiken (SVG)
   ========================================================= */
function ring(pct, label, sub, size = 236){
  const st = 16, r = (size - st) / 2 - 8, cx = size / 2, c = 2 * Math.PI * r, p = clamp(pct) / 100;
  const ang = (-90 + 360 * p) * Math.PI / 180, kx = cx + r * Math.cos(ang), ky = cx + r * Math.sin(ang);
  return `<div class="ring l-${lvl(pct)}" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cx}" r="${r}" class="ring-track" style="stroke-width:${st}"/>
      ${p > 0 ? `<circle cx="${cx}" cy="${cx}" r="${r}" class="ring-val" transform="rotate(-90 ${cx} ${cx})" style="stroke-width:${st};stroke-dasharray:${c};stroke-dashoffset:${c * (1 - p)};--len:${c}"/>
      <circle cx="${kx}" cy="${ky}" r="${st / 2 + 4}" class="ring-knob"/>` : ''}
    </svg>
    <div class="ring-c"><b>${label}</b><span>${sub}</span></div></div>`;
}
/* 3/4-Bogen wie beim Klima-Regler */
function arc(pct, inner, size = 230, cls){
  const st = 14, r = (size - st) / 2 - 6, cx = size / 2, c = 2 * Math.PI * r, span = .75 * c, p = clamp(pct) / 100;
  const ang = (135 + 270 * p) * Math.PI / 180, kx = cx + r * Math.cos(ang), ky = cx + r * Math.sin(ang);
  return `<div class="arc-wrap l-${cls || lvl(pct)}" style="width:${size}px;height:${size * .86}px">
    <svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;position:absolute;top:0">
      <defs><linearGradient id="arcg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="rgba(255,255,255,.08)"/><stop offset="1" stop-color="var(--c)"/></linearGradient></defs>
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="${st}" stroke-linecap="round" transform="rotate(135 ${cx} ${cx})" style="stroke-dasharray:${span} ${c}"/>
      <circle cx="${cx}" cy="${cx}" r="${r}" class="arc-val" stroke-width="${st}" transform="rotate(135 ${cx} ${cx})" style="stroke:url(#arcg);stroke-dasharray:${span} ${c};stroke-dashoffset:${span * (1 - p)}"/>
      ${p > 0 ? `<circle cx="${kx}" cy="${ky}" r="${st / 2 + 4}" class="ring-knob"/>` : ''}
    </svg>
    <div class="arc-c">${inner}</div></div>`;
}
/* Team-Auslastung über 12 Monate (Balken + Stufenlinie) */
function teamChart(ms){
  const W = 420, H = 170, L = 6, R = 30, T = 12, B = 24, n = ms.length, bw = (W - L - R) / n;
  const us = ms.map(m => teamMonth(m.key).util), maxU = Math.max(120, ...us) * 1.05;
  const Y = u => T + (1 - Math.min(u, maxU) / maxU) * (H - T - B);
  let g = `<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="2.5" height="6" fill="rgba(232,137,123,.6)"/></pattern></defs>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${Y(100)}" y2="${Y(100)}" class="ch-ref over"/><text x="${W - R + 4}" y="${Y(100) + 3}" class="ch-tag">100%</text>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${Y(S().fullLoad)}" y2="${Y(S().fullLoad)}" class="ch-ref"/><text x="${W - R + 4}" y="${Y(S().fullLoad) + 3}" class="ch-tag">${S().fullLoad}%</text>`;
  let path = '';
  us.forEach((u, i) => {
    const x = L + i * bw, y = Y(u);
    g += `<rect x="${x + 4}" y="${y}" width="${bw - 8}" height="${H - B - y}" rx="5" class="ch-bar l-${lvl(u)}" style="animation-delay:${i * 40}ms;${u > 100 ? 'fill:url(#hatch)' : ''}"><title>${ms[i].long}: ${fmtP(u)}</title></rect>`;
    path += (i ? `H${x} V${y} ` : `M${x} ${y} `) + `H${x + bw} `;
    if(i % 2 === 0) g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" class="lbl">${ms[i].short}</text>`;
  });
  g += `<path d="${path}" class="ch-line"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
/* freie Team-Stunden der nächsten 6 Monate */
function freeChart(ms){
  const W = 260, H = 110, n = ms.length, bw = W / n, fs = ms.map(m => teamMonth(m.key).free), max = Math.max(...fs, 1);
  let g = `<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8D19A" stop-opacity=".75"/><stop offset="1" stop-color="#A8D19A" stop-opacity=".08"/></linearGradient></defs>`;
  fs.forEach((f, i) => {
    const h = Math.max(4, f / max * (H - 8)), x = i * bw;
    g += `<rect x="${x + 3}" y="${H - h}" width="${bw - 6}" height="${h}" rx="6" fill="url(#fg)" class="ch-bar l-good" style="stroke:none;animation-delay:${i * 50}ms"><title>${ms[i].long}: ${fmtH(f)} frei</title></rect>`;
  });
  return `<div class="minichart"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="lbls">${ms.map(m => `<span>${m.short}</span>`).join('')}</div></div>`;
}
function heat(u, hours, label){
  return `<div class="hc l-${lvl(u)}" title="${label ? label + ': ' : ''}${fmtH(hours)} · ${fmtP(u)}"><b>${u > 0 ? fmtP(u) : '–'}</b><small>${label || fmtH(hours)}</small></div>`;
}

function filteredProjects(){
  const q = ui.projSearch.trim().toLowerCase();
  return state.projects.filter(p => (ui.projFilter === 'all' || projStatus(p) === ui.projFilter) && (ui.projEmp === 'all' || p.employeeId === ui.projEmp)
    && (!q || `${p.number} ${p.name} ${(empById(p.employeeId) || {}).name || ''}`.toLowerCase().includes(q)))
    // offene Projekte zuerst (nach Baustart), abgeschlossene danach (neueste zuerst)
    .sort((a, b) => (a.closed - b.closed) || (a.closed ? (b.closedAt || '').localeCompare(a.closedAt || '') : (a.start || '').localeCompare(b.start || '')));
}
function renderProjects(){

function projectListHTML(list){
  if(!list.length) return `<section class="glass card" style="text-align:center;padding:40px"><p class="muted">Keine Projekte gefunden.</p><button class="btn btn-primary" style="margin-top:14px" data-action="new-project">${I.plus} Projekt erfassen</button></section>`;
  if(ui.projMode === 'list'){
    return `<section class="glass card"><div class="tbl-wrap"><table class="tbl" style="min-width:1180px"><thead><tr><th>Nr.</th><th>Projekt</th><th>Projektleiter</th><th>PL-Std. Ist / Budget</th><th>Baustart</th><th>Fertig</th><th style="min-width:200px">Fortschritt</th><th>Status</th><th class="r">DB</th><th></th></tr></thead><tbody>
      ${list.map(p => projRow(p, true)).join('')}
    </tbody></table></div></section>`;
  }
  // Zeitstrahl
  const t = today0();
  const st = list.map(p => +parseD(p.start || todayISO())), en = list.map(p => +parseD(p.end || todayISO()));
  let a = new Date(Math.min(...st, +t)); a = new Date(a.getFullYear(), a.getMonth(), 1);
  const bd = new Date(Math.max(...en, +t)); let b = new Date(bd.getFullYear(), bd.getMonth() + 1, 1);
  if((b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth() > 30){ a = new Date(t.getFullYear(), t.getMonth() - 6, 1); b = new Date(a.getFullYear(), a.getMonth() + 30, 1); }
  const span = b - a, pos = d => (d - a) / span * 100;
  const ms = []; for(let d = new Date(a); d < b; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) ms.push(new Date(d));
  const step = ms.length > 20 ? 3 : ms.length > 12 ? 2 : 1;
  const groups = state.employees.map(e => ({ e, ps: list.filter(p => p.employeeId === e.id) })).filter(g => g.ps.length);
  const un = list.filter(p => !empById(p.employeeId)); if(un.length) groups.push({ e: null, ps: un });
  let i = 0;
  return `<section class="glass card"><div class="gantt-scroll"><div class="gantt">
    <div class="g-head"><div class="g-label"><span class="eyebrow">Projektleiter / Projekt</span></div><div class="g-track g-months">${ms.map((m, k) => k % step ? '' : `<span style="left:${pos(m)}%;width:${pos(new Date(m.getFullYear(), m.getMonth() + step, 1)) - pos(m)}%">${MONTHS[m.getMonth()]}${m.getMonth() < step || k === 0 ? ' ' + String(m.getFullYear()).slice(2) : ''}</span>`).join('')}</div></div>
    <div class="g-body">
      <div class="g-grid">${ms.map(m => `<i style="left:${pos(m)}%"></i>`).join('')}<b class="g-today" style="left:${pos(t)}%"><em>Heute</em></b></div>
      ${groups.map(g => `<div class="g-group"><div class="g-label">${avatar(g.e, 'sm')}<b>${g.e ? esc(g.e.name) : 'Nicht zugewiesen'}</b></div>
        <div class="g-gmeta">${g.e ? `${months(0, 1)[0].short}: ${fmtP(util(g.e, curKey()))} · frei ${freeFrom(g.e)}` : ''}</div></div>
        ${g.ps.map(p => { const ps = parseD(p.start || todayISO()), pe = new Date(parseD(p.end || todayISO()).getTime() + DAY); const l = clamp(pos(ps)), w = Math.max(clamp(pos(pe)) - l, .8), s = projStatus(p);
          return `<div class="g-row"><div class="g-label" title="${esc(p.name)}"><span class="g-num">${esc(p.number)}</span><span class="g-name">${esc(p.name)}</span></div>
            <div class="g-track"><button class="g-bar ${s}" style="left:${l}%;width:${w}%;animation-delay:${Math.min(i++, 16) * 35}ms" data-action="edit-project" data-id="${p.id}" data-flash="${p.id}"
              title="${esc(p.name)} · ${fmtH(p.hours)} · ${fmtDate(p.start)} – ${fmtDate(p.end)} · Fortschritt ${p.progress} %${p.closed ? ' · DB ' + fmtDB(p.finalDB) : ''}"><span class="g-fill" style="width:${p.progress}%"></span><span>${p.closed ? `✓ DB ${fmtDB(p.finalDB)}` : `${p.progress} % · ${fmtH(p.hours)}`}</span></button></div></div>`; }).join('')}`).join('')}
    </div></div></div>
    <div class="legend"><span><i class="l-good"></i>laufend (Füllung = Fortschritt)</span><span><i class="l-full"></i>geplant</span><span><i class="l-over"></i>Enddatum vorbei – abschliessen</span><span><i class="l-none"></i>abgeschlossen</span></div>
  </section>`;
}

    <div class="seg">${[['all', 'Alle Jahre'], ...years.map(y => [y, y])].map(([k, l]) => `<button class="${ui.resYear === k ? 'on' : ''}" data-action="res-year" data-val="${k}">${l}</button>`).join('')}</div>
  </div>

  <div class="results">

      <div class="card-h" style="align-self:stretch"><span class="ic">${I.trophy}</span><h3>Ø DB ${ui.resYear === 'all' ? 'gesamt' : ui.resYear}</h3></div>
      ${arc(avg == null ? 0 : clamp(avg / Math.max(S().dbGood * 1.75, 1) * 100), `<b class="num">${avg == null ? '–' : avg.toLocaleString('de-CH', { maximumFractionDigits: 1 })}<small>%</small></b><span>${closed.length} abgeschlossene Projekte</span>`, 230, dbLvl(avg))}
      <span class="pill lv l-${dbLvl(avg)}" style="margin-top:6px"><span class="dot"></span>${DBL[dbLvl(avg)]} · Ziel ≥ ${S().dbGood} %</span>
      <p class="hint" style="text-align:center">gewichtet nach PL-Stunden: <b style="color:var(--text)">${fmtDB(wavg)}</b></p>
    </section>

    <section class="glass card">
      <div class="card-h"><span class="ic">${I.users}</span><h3>Ø DB pro Mitarbeiter</h3><span class="right"><small>jeder Punkt = ein Projekt</small></span></div>
      ${rows.length ? rows.map(({ e, ps, a }) => `<div class="tile rank-row l-${dbLvl(a)}" data-action="open-emp" data-id="${e.id}">
          ${avatar(e)}<div><b>${esc(e.name)}</b><small>${ps.length} Projekt${ps.length > 1 ? 'e' : ''} · ${fmtDB(Math.min(...ps.map(p => p.finalDB)))} bis ${fmtDB(Math.max(...ps.map(p => p.finalDB)))}</small>
            ${(() => { const hp = ps.filter(p => p.istStd > 0 && p.hours > 0); if(!hp.length) return ''; const dv = hp.reduce((s, p) => s + (p.istStd - p.hours) / p.hours * 100, 0) / hp.length; return `<small style="color:${dv > 0 ? 'var(--red)' : 'var(--sage)'}">Stunden Ø ${dv > 0 ? '+' : ''}${Math.round(dv)} % zum Budget</small>`; })()}</div>
          <div class="dots-wrap"><div class="dots">${zones}${ps.map(p => `<i class="d l-${dbLvl(p.finalDB)}" style="left:${X(p.finalDB)}%" title="${esc(p.number)} ${esc(p.name)}: ${fmtDB(p.finalDB)}"></i>`).join('')}<i class="am" style="left:${X(a)}%" title="Ø ${fmtDB(a)}"></i></div></div>
          <div class="avg num">${fmtDB(a)}</div>
        </div>`).join('') + `<div class="scale-l" style="padding:0 14px"><span>${Math.round(lo)} %</span><span>rot &lt; ${S().dbBad} % · orange &lt; ${S().dbGood} % · grün ≥ ${S().dbGood} %</span><span>${Math.round(hi)} %</span></div>`

      <section class="glass card" style="padding:16px">
        <div class="card-h" style="margin-bottom:10px"><span class="ic">${I.flag}</span><h3>Abzuschliessen</h3><span class="right"><span class="pill ${due.length ? 'lv l-over' : ''}">${due.length}</span></span></div>

      ${closed.map(p => { const e = empById(p.employeeId); return `<tr data-action="edit-project" data-id="${p.id}" data-flash="${p.id}"><td class="muted">${esc(p.number)}</td><td>${esc(p.name)}</td>
