        <div class="grid-2">${field('Baustart', `<input type="date" data-plan="start" value="${p.start}">`)}${field('Fertigstellung', `<input type="date" data-plan="end" value="${p.end}">`)}</div>

function plannerResults(){
  const box = document.getElementById('plan-res'), sum = document.getElementById('plan-sum');
  if(!box) return;
  const p = ui.plan, valid = p.hours > 0 && p.start && p.end && p.end >= p.start;
  if(!valid){ box.innerHTML = '<p class="muted">Bitte Stunden, Baustart und Fertigstellung angeben (Fertig nach Baustart).</p>'; sum.innerHTML = ''; return; }
  const wm = workMonths({ ...p }), cands = rankCandidates({ ...p, id: '__plan' });

    <div class="strip" style="--n:${c.rows.length}">${c.rows.map(r => { const [y, m] = r.key.split('-'); return `<div class="hc l-${lvl(r.with)} ${r.with - r.base > .5 ? 'with' : ''}" title="${MONTHS_L[+m - 1]} ${y}: vorher ${fmtP(r.base)}, mit Projekt ${fmtP(r.with)}"><b>${fmtP(r.with)}</b><small>${MONTHS[+m - 1]} ${y.slice(2)}</small></div>`; }).join('')}</div>
  </div>`).join('');
}

/* =========================================================
   Modals
   ========================================================= */
let curOverlay = null, lastPt = null;
const field = (label, input, hint = '') => `<div class="field"><label>${label}</label>${input}${hint ? `<small>${hint}</small>` : ''}</div>`;
function openModal({ title, sub = '', body, foot, size = '' }){
  closeModal(true);
  const root = document.getElementById('modal-root');
  root.insertAdjacentHTML('beforeend', `<div class="overlay"><div class="modal ${size}" role="dialog" aria-modal="true">
    <div class="modal-h"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><button class="round sm" data-close aria-label="Schliessen">${I.x}</button></div>
    <div class="modal-b">${body}</div><div class="modal-f">${foot}</div></div></div>`);
  const ov = root.lastElementChild, m = ov.querySelector('.modal');
  curOverlay = ov;
  requestAnimationFrame(() => ov.classList.add('show'));
  if(!REDUCED){
    const r = m.getBoundingClientRect();
    if(lastPt) m.style.transformOrigin = `${lastPt.x - r.left}px ${lastPt.y - r.top}px`;
    m.animate([{ transform: 'scale(.85)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.2,1.2,.4,1)' });
  }
  ov.addEventListener('mousedown', ev => { if(ev.target === ov) closeModal(); });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal()));
  const f = ov.querySelector('.modal-b input:not([type=checkbox]), .modal-b select');
  if(f) setTimeout(() => f.focus({ preventScroll: true }), 80);
  return ov;
}
function closeModal(instant){
  const ov = curOverlay; curOverlay = null;
  if(!ov) return;
  // während der Bearbeitung zurückgehaltene Änderung von einem anderen Gerät jetzt übernehmen
  if(pendingRemote) setTimeout(() => { if(pendingRemote && !curOverlay) applyRemote(pendingRemote); }, 350);
  if(instant || REDUCED){ ov.remove(); return; }
  ov.classList.add('leaving'); ov.classList.remove('show');
  ov.querySelector('.modal').animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(.92) translateY(10px)', opacity: 0 }], { duration: 200, easing: 'ease-in', fill: 'forwards' }).onfinish = () => ov.remove();
}
function showErrors(box, errs){ box.hidden = !errs.length; box.innerHTML = errs.length ? `Bitte prüfen:<ul>${errs.map(e => `<li>${e}</li>`).join('')}</ul>` : ''; }

  });

  f.addEventListener('change', paint); paint();

    else { const ne = { id: uid(), ...data }; state.employees.push(ne); ui.flash = ne.id; toast(`${name} angelegt`); }
    save(); closeModal(); render();
  });
}

        ${field('Baustart *', `<input name="start" type="date" value="${esc(p.start)}">`)}

      </div><p class="hint" id="p-dist"></p></div>

        <div id="p-pick"></div></div>
      <div class="form-sec"><h4>Stand</h4>
        <div class="grid-2">
          ${field('Fortschritt', `<div class="prog big"><span class="track"><input type="range" name="progress" min="0" max="100" step="5" value="${p.progress || 0}" style="--v:${p.progress || 0}%" ${ex && ex.closed ? 'disabled' : ''}><i class="tmark" id="p-tmark" hidden></i></span><b id="p-progl">${p.progress || 0} %</b></div>`)}
          ${field('Aufgewendete Stunden Projektleiter', `<div class="affix"><input name="istStd" type="number" min="0" step="1" value="${p.istStd || ''}" placeholder="0"><span>Std.</span></div>`)}
        </div>
        <p class="hint" id="p-proghint"></p><div id="p-hrs"></div></div>
      <div class="form-sec"><h4>Auswirkung auf die Auslastung</h4><div id="p-impact"></div></div>
      ${field('Notiz', `<textarea name="note" maxlength="500" placeholder="optional">${esc(p.note)}</textarea>`)}
    </form>`,
    foot: `${ex ? `<button class="btn btn-danger spacer" id="p-del">${I.trash} Löschen</button>` : ''}
      ${ex && !ex.closed ? `<button class="btn" id="p-close">${I.flag} Abschliessen</button>` : ''}
      ${ex && ex.closed ? `<button class="btn" id="p-reopen">Wiedereröffnen</button><button class="btn" id="p-close">${I.edit} Abschluss bearbeiten</button>` : ''}

  });
  const f = ov.querySelector('#pform');
  if(ex) ov.querySelector('#p-del').addEventListener('click', () => confirmDel('project', ex.id));
  const bc = ov.querySelector('#p-close'), br = ov.querySelector('#p-reopen');
  if(bc) bc.addEventListener('click', () => { Object.assign(ex, { progress: num(f.progress.value), istStd: Math.max(0, num(f.istStd.value)) }); save(); closeProjectModal(ex.id); });
  if(br) br.addEventListener('click', () => { ex.closed = false; ex.closedAt = ''; ui.flash = ex.id; save(); closeModal(); render(); toast('Projekt wiedereröffnet – DB bleibt gespeichert, bis du erneut abschliesst'); });
  const selEmp = () => (f.querySelector('input[name="employeeId"]:checked') || {}).value || '';
  const read = () => ({ number: f.number.value.trim(), name: f.name.value.trim(), employeeId: selEmp(), hours: num(f.hours.value), start: f.start.value, end: f.end.value, note: f.note.value.trim(),
    progress: Math.round(clamp(num(f.progress.value))), istStd: Math.max(0, num(f.istStd.value)) });
  /* Projektleiter-Auswahl: mit Zeit oben, ohne Zeit unten mit Vermerk.
     Beim Bearbeiten ist der bisherige PL fixiert – wechseln nur bewusst über "Projektleiter wechseln". */
  const origEmp = ex && empById(ex.employeeId) ? ex.employeeId : '';
  let changePL = !origEmp;
  let lastKey = '';
  const renderPick = (force) => {
    const d = read(), key = `${d.hours}|${d.start}|${d.end}|${changePL}`;
    if(!force && key === lastKey) return;
    lastKey = key;
    const cur = d.employeeId || p.employeeId || '';
    const valid = d.hours > 0 && d.start && d.end && d.end >= d.start;
    if(!changePL){
      const e = empById(cur), c = valid ? rankCandidates({ ...d, id: '__d' }, ex.id).find(x => x.e.id === e.id) : null;
      ov.querySelector('#p-pick').innerHTML = `<div class="pl-locked tile l-${c ? c.verdict : 'none'}">
        <input type="radio" name="employeeId" value="${e.id}" checked hidden>${avatar(e)}

        <button type="button" class="btn btn-sm" data-pl="change">${I.users} Projektleiter wechseln</button></div>`;
      return;
    }
    const opt = (e, c, no) => `<label class="pick-opt l-${c ? c.verdict : 'none'} ${no ? 'no' : ''}"><input type="radio" name="employeeId" value="${e.id}" ${cur === e.id ? 'checked' : ''}>${avatar(e, 'sm')}
      <span class="po-t"><b>${esc(e.name)}</b><small>${c ? `${no ? 'keine Zeit · ' : ''}max. ${fmtP(c.peak)} im Zeitraum · ${fmtH(c.free)} frei` : esc(e.role || '')}</small></span>
      ${c ? `<span class="pill lv l-${c.verdict}">${no ? 'keine Zeit' : VERDICT[c.verdict]}</span>` : ''}</label>`;
    const box = ov.querySelector('#p-pick');
    if(!valid){ box.innerHTML = `<p class="hint" style="margin:0 0 10px">Stunden, Baustart und Fertigstellung eingeben – dann siehst du, wer Zeit hat.</p><div class="pick">${state.employees.map(e => opt(e, null, false)).join('')}</div>`; return; }
    const cands = rankCandidates({ ...d, id: '__d' }, ex ? ex.id : null);
    const ok = cands.filter(c => c.verdict !== 'over'), no = cands.filter(c => c.verdict === 'over');
    const keep = origEmp ? `<div class="pl-keep"><span>Bisher: <b>${esc(empById(origEmp).name)}</b> – neuen Projektleiter wählen</span><button type="button" class="linkish" data-pl="keep">Abbrechen, bei ${esc(empById(origEmp).name.split(' ')[0])} bleiben</button></div>` : '';
    box.innerHTML = keep + (ok.length ? `<div class="pick">${ok.map(c => opt(c.e, c, false)).join('')}</div>` : `<div class="note l-over" style="margin:0">Niemand hat im gewählten Zeitraum genügend Kapazität. Zeitraum verlängern oder Stunden prüfen.</div>`)
      + (no.length ? `<div class="pick-sep">Keine Zeit im Zeitraum</div><div class="pick">${no.map(c => opt(c.e, c, true)).join('')}</div>` : '');
  };
  ov.querySelector('#p-pick').addEventListener('click', ev => {
    const b = ev.target.closest('[data-pl]'); if(!b) return;
    if(b.dataset.pl === 'change'){ changePL = true; renderPick(true); update(); }
    else { changePL = false; p.employeeId = origEmp; ov.querySelector('#p-pick').innerHTML = ''; renderPick(true); update(); }
  });
  const update = () => {
    renderPick();
    const d = read(), box = ov.querySelector('#p-impact'), dist = ov.querySelector('#p-dist');
    // aufgewendete Stunden vs. Budget
    const hr = d.hours > 0 ? d.istStd / d.hours * 100 : 0, hs = hoursState(d);
    ov.querySelector('#p-hrs').innerHTML = d.istStd > 0 ? `<div class="note l-${HSL[hs]}">${fmtH(d.istStd)} von ${fmtH(d.hours)} aufgewendet (${fmtP(hr)}) · ${hs === 'over' ? `<b>${fmtH(d.istStd - d.hours)} über Budget</b>` : hs === 'warn' ? `mehr Stunden verbraucht als Fortschritt (${d.progress} %)` : `noch ${fmtH(d.hours - d.istStd)} verfügbar`}</div>` : '';
    // Fortschritt vs. verstrichene Zeit
    f.progress.style.setProperty('--v', d.progress + '%'); ov.querySelector('#p-progl').textContent = d.progress + ' %';
    const tp = timePct(d), tm = ov.querySelector('#p-tmark'), ph = ov.querySelector('#p-proghint');
    tm.hidden = tp == null || (ex && ex.closed); if(tp != null) tm.style.left = tp + '%';
    ph.innerHTML = tp == null ? '' : `Zeit verstrichen: <b style="color:var(--amber)">${Math.round(tp)} %</b> (oranger Strich)${tp - d.progress > 15 && !(ex && ex.closed) ? ' – Fortschritt liegt hinter dem Zeitplan.' : ''}`;
    const valid = d.hours > 0 && d.start && d.end && d.end >= d.start;
    const wm = valid ? workMonths(d) : 0;
    dist.textContent = valid ? `≈ ${fmtH(d.hours / wm)} pro Monat über ${wm} Monat${wm > 1 ? 'e' : ''} (verteilt auf Arbeitstage).` : '';
    const e = empById(d.employeeId);
    if(!e || !valid){ box.innerHTML = '<p class="muted" style="font-size:13px">Stunden, Zeitraum und Projektleiter wählen, um die Auswirkung zu sehen.</p>'; return; }
    const keys = Object.keys(projectMonths(d)).sort().slice(0, 12);
    const draft = { ...d, id: '__d', employeeId: e.id };
    const base = keys.map(k => util(e, k, { excludeId: ex ? ex.id : null })), withP = keys.map(k => util(e, k, { excludeId: ex ? ex.id : null, extra: draft }));
    const peak = Math.max(...withP), lb = k => { const [y, m] = k.split('-'); return `${MONTHS[+m - 1]} ${y.slice(2)}`; };
    box.innerHTML = `<div class="impact" style="--n:${keys.length}"><span></span>${keys.map(k => `<span class="ih">${lb(k)}</span>`).join('')}
      <span class="il">ohne Projekt</span>${base.map(u => `<div class="hc l-${lvl(u)}"><b>${fmtP(u)}</b></div>`).join('')}
      <span class="il">mit Projekt</span>${withP.map((u, i) => `<div class="hc l-${lvl(u)} ${u - base[i] > .5 ? 'with' : ''}"><b>${fmtP(u)}</b></div>`).join('')}</div>

  };

    const bad = (n, m) => { errs.push(m); f[n].classList.add('invalid'); };
    ov.querySelectorAll('.pick').forEach(x => x.classList.remove('invalid-box'));

    if(d.hours <= 0) bad('hours', 'Aufwand muss grösser als 0 sein.');
    if(!d.start) bad('start', 'Baustart fehlt.');
    if(!d.end) bad('end', 'Fertigstellung fehlt.'); else if(d.start && d.end < d.start) bad('end', 'Fertigstellung liegt vor dem Baustart.');
    if(d.number && state.projects.some(x => x.number === d.number && (!ex || x.id !== ex.id))) bad('number', 'Projektnummer ist bereits vergeben.');
    showErrors(f.querySelector('.errors'), errs); if(errs.length) return;
    if(ex){
      const from = ex.employeeId;

    }
    else { const np = { id: uid(), ...d }; state.projects.push(np); ui.flash = np.id; toast(`Projekt ${d.number || d.name} angelegt`); }
    save(); closeModal(); render();
  });
}

/* ---------- Projekt abschliessen: Abschluss-DB eintragen ---------- */
function closeProjectModal(id){
  const p = projById(id), e = empById(p.employeeId);
  const def = p.closedAt || (p.end && p.end < todayISO() ? p.end : todayISO());
  const prevAvg = e ? avgDB(empProjects(e).filter(x => x.id !== p.id)) : null;
  const ov = openModal({
    title: p.closed ? 'Abschluss bearbeiten' : 'Projekt abschliessen', sub: `${esc(p.number)} · ${esc(p.name)}${e ? ' · ' + esc(e.name) : ''}`,
    body: `<form class="form" id="cform" novalidate><div class="errors" hidden></div>
      <div class="grid-2">
        ${field('Abschlussdatum *', `<input type="date" name="closedAt" value="${def}">`)}
        ${field('DB bei Abschluss *', `<div class="affix"><input name="finalDB" type="number" step="0.1" value="${p.finalDB ?? ''}" placeholder="z. B. 18.5"><span>%</span></div>`, 'Deckungsbeitrag, mit dem das Projekt abgeschlossen hat (auch negativ möglich).')}
      </div>
      <div id="db-prev"></div>
      ${field('Aufgewendete Stunden Projektleiter (total)', `<div class="affix"><input name="istStd" type="number" min="0" step="1" value="${p.istStd || ''}" placeholder="0"><span>/ ${fmtH(p.hours)}</span></div>`)}
      <div id="hrs-prev"></div>
      ${field('Notiz zum Abschluss', `<textarea name="closeNote" maxlength="500" placeholder="optional – z. B. Gründe für die Abweichung">${esc(p.closeNote)}</textarea>`)}
      <p class="hint">Der Fortschritt wird auf 100 % gesetzt. Stunden nach dem Abschlussmonat zählen nicht mehr zur Auslastung.</p>
    </form>`,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn btn-primary" type="submit" form="cform">${I.check} ${p.closed ? 'Speichern' : 'Projekt abschliessen'}</button>`
  });
  const f = ov.querySelector('#cform');
  const upd = () => {
    const raw = f.finalDB.value.trim(), db = raw === '' ? null : num(raw), l = dbLvl(db);
    ov.querySelector('#db-prev').innerHTML = db == null ? '' : `<div class="note l-${l}">DB ${fmtDB(db)} · <b>${DBL[l]}</b>${prevAvg != null ? ` · Ø von ${esc(e.name)} bisher ${fmtDB(prevAvg)} (${db >= prevAvg ? 'darüber' : 'darunter'})` : ''}</div>`;
    const ist = num(f.istStd.value), d = ist - p.hours;
    ov.querySelector('#hrs-prev').innerHTML = ist > 0 ? `<div class="note l-${d > 0 ? 'over' : 'good'}">${d > 0 ? `${fmtH(d)} (${fmtP(d / p.hours * 100)}) über dem Stundenbudget` : `${fmtH(-d)} unter dem Stundenbudget`}</div>` : '';
  };
  f.addEventListener('input', upd); upd();
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    const errs = [], raw = f.finalDB.value.trim();
    f.querySelectorAll('.invalid').forEach(x => x.classList.remove('invalid'));
    if(!f.closedAt.value){ errs.push('Abschlussdatum fehlt.'); f.closedAt.classList.add('invalid'); }
    if(raw === '' || !isFinite(num(raw))){ errs.push('Bitte den DB in % eintragen.'); f.finalDB.classList.add('invalid'); }
    showErrors(f.querySelector('.errors'), errs); if(errs.length) return;
    Object.assign(p, { closed: true, closedAt: f.closedAt.value, finalDB: Math.round(num(raw) * 10) / 10, closeNote: f.closeNote.value.trim(), progress: 100, istStd: Math.max(0, num(f.istStd.value)) });
    ui.flash = p.id; save(); closeModal(); render();
    toast(`${p.name} abgeschlossen · DB ${fmtDB(p.finalDB)}`, dbLvl(p.finalDB) === 'over' ? 'warn' : 'ok');

}

function exportData(){
  const blob = new Blob([JSON.stringify({ app: 'ProjektCockpit-Auslastung', version: 2, exportedAt: new Date().toISOString(), ...state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `auslastung_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Export erstellt');
}
document.getElementById('import-file').addEventListener('change', ev => {
  const file = ev.target.files[0]; ev.target.value = ''; if(!file) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.employees) || !Array.isArray(d.projects)) throw 0;
      // Daten aus der alten Version: Wochenkapazität / Soll-Stunden übernehmen
      d.employees.forEach(e => { if(!e.hours && e.weeklyCapacity) e.hours = Math.round(e.weeklyCapacity * 4.33); });
      d.projects.forEach(p => { if(!p.hours && p.sollStd) p.hours = p.sollStd; });
      const next = normalize(d);
      if(!(await safeguard('Vor Import'))) return;
      state = next; save(); closeModal(); ui.view = 'home'; render({ anim: true });
      toast(`${state.employees.length} Mitarbeiter & ${state.projects.length} Projekte importiert`);
    }catch(e){ toast('Import fehlgeschlagen – ungültige Datei', 'err'); }
  };
  r.readAsText(file);
});

  const b = ev.target.closest('.btn'); if(!b || REDUCED) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, s = document.createElement('span');
  s.className = 'ripple'; s.style.cssText = `width:${d}px;height:${d}px;left:${ev.clientX - r.left - d / 2}px;top:${ev.clientY - r.top - d / 2}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 650);
}, true);

document.addEventListener('click', ev => {
  if(ev.target.closest('.prog, .ist-in')) return; // Regler / Stundenfeld bedienen, ohne die Zeile zu öffnen
  const el = ev.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action, id = el.dataset.id, val = el.dataset.val;
  if(el.closest('#modal-root') && !['edit-project'].includes(a)) return;
  ev.stopPropagation();
  switch(a){
    case 'nav': go(el.dataset.view); break;
    case 'open-emp': qres.hidden = true; q.value = ''; go('employee', { empId: id }); break;
    case 'new-project':
      if(!state.employees.length){ toast('Bitte zuerst einen Mitarbeiter anlegen', 'warn'); empModal(); }
      else projectModal(null, el.dataset.emp); break;
    case 'edit-project': qres.hidden = true; projectModal(id); break;
    case 'del-project': confirmDel('project', id); break;
    case 'close-project': closeProjectModal(id); break;
    case 'res-year': ui.resYear = val; render(); break;
    case 'new-emp': empModal(); break;
    case 'edit-emp': empModal(id); break;
    case 'del-emp': confirmDel('emp', id); break;
    case 'settings': settingsModal(); break;
    case 'demo': loadDemo(); break;
    case 'import': document.getElementById('import-file').click(); break;
    case 'home-month': ui.homeOff = +val; render(); break;
    case 'cap-shift': ui.capOff = +val === 0 ? 0 : ui.capOff + +val; render(); break;
    case 'cell': cellModal(id, el.dataset.key); break;
    case 'proj-mode': ui.projMode = val; render(); break;
    case 'proj-filter': ui.projFilter = val; render(); break;
    case 'quick-h': ui.quick.hours = Math.max(10, ui.quick.hours + +val); render(); break;
    case 'quick-plan': ui.plan = { name: '', number: nextNumber(), hours: ui.quick.hours, start: ui.quick.start, end: ui.quick.end }; go('planner'); setTimeout(plannerResults); break;
    case 'plan-h': { ui.plan.hours = Math.max(1, num(ui.plan.hours) + +val); const inp = document.querySelector('[data-plan="hours"]'); if(inp) inp.value = ui.plan.hours; plannerResults(); break; }
    case 'plan-assign': projectModal(null, id, { name: ui.plan.name, number: ui.plan.number, hours: ui.plan.hours, start: ui.plan.start, end: ui.plan.end }); break;
    case 'setup-add': setupAdd(); break;
  }
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape'){ if(curOverlay) closeModal(); qres.hidden = true; }
  if(ev.key === 'Enter' && ev.target.closest('.setup-add')){ ev.preventDefault(); setupAdd(); }
  if(ev.key === 'Enter' && ev.target.matches('.ist-in')){ ev.preventDefault(); ev.target.blur(); }
});
const viewEl = document.getElementById('view');
viewEl.addEventListener('input', ev => {
  const t = ev.target;
  if(t.dataset.progress){
    t.style.setProperty('--v', t.value + '%');
    const l = viewEl.querySelector(`[data-prog-l="${t.dataset.progress}"]`); if(l) l.textContent = t.value + ' %';
    return;
  }
  if(t.dataset.input === 'proj-search'){ ui.projSearch = t.value; document.getElementById('proj-list').innerHTML = projectListHTML(filteredProjects()); }
  if(t.dataset.plan){ ui.plan[t.dataset.plan] = t.dataset.plan === 'hours' ? num(t.value) : t.value; plannerResults(); }
});
viewEl.addEventListener('change', ev => {
  const t = ev.target;
  if(t.dataset.ist){
    const p = projById(t.dataset.ist); if(!p) return;
    p.istStd = Math.max(0, num(t.value)); save();
    const cell = t.closest('.hrs'), r = p.hours > 0 ? p.istStd / p.hours * 100 : 0, s = hoursState(p);
    if(cell){ cell.className = `hrs l-${p.istStd > 0 ? HSL[s] : 'none'}`; cell.querySelector('.hb i').style.width = clamp(r) + '%'; cell.querySelector(`[data-ist-p]`).textContent = p.istStd > 0 ? fmtP(r) : ''; }
    renderTop();
    if(s === 'over') toast(`${p.name}: ${fmtH(p.istStd - p.hours)} über dem Stundenbudget`, 'err');
    else if(s === 'warn') toast(`${p.name}: ${fmtP(r)} der Stunden verbraucht, Fortschritt erst ${p.progress} %`, 'warn');
    return;
  }
  if(t.dataset.progress){
    const p = projById(t.dataset.progress); if(!p) return;
    p.progress = +t.value; save();
    const hc = t.closest('tr') && t.closest('tr').querySelector('.hrs');
    if(hc && p.istStd > 0) hc.className = `hrs l-${HSL[hoursState(p)]}`;
    const tp = timePct(p), wrap = t.closest('.prog');
    if(wrap) wrap.classList.toggle('behind', tp != null && tp - p.progress > 15);
    if(p.progress === 100 && !p.closed) toast(`${p.name}: 100 % – jetzt abschliessen und DB eintragen`, 'warn');
    return;
  }
  if(t.dataset.change === 'sort-load'){ ui.sortLoad = t.checked; render(); }
  if(t.dataset.change === 'proj-emp'){ ui.projEmp = t.value; render(); }
  if(t.dataset.quick){ ui.quick[t.dataset.quick] = t.value; if(ui.quick.end < ui.quick.start) ui.quick.end = ui.quick.start; render(); }
  if(t.dataset.setup){ state.settings[t.dataset.setup] = t.value.trim() || (t.dataset.setup === 'numberPrefix' ? '320' : ''); save(); render(); }
});
function setupAdd(){
  const n = document.getElementById('su-name'), name = n.value.trim();
  if(!name){ n.classList.add('invalid'); n.focus(); return; }
  state.employees.push({ id: uid(), name, role: document.getElementById('su-role').value.trim(), hours: num(document.getElementById('su-h').value) || S().defaultHours, color: COLORS[state.employees.length % COLORS.length] });
  save(); render({ anim: true }); toast(`${name} hinzugefügt – Projekte erfasst du über +`);
}

bootCloud();
</script>
